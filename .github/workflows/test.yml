name: test

on:
  push:
  pull_request:

jobs:
  toml:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install Qt
        run: pacman -Syu --noconfirm git qt6-declarative
      - uses: actions/checkout@v4
      - name: Run the TOML tests
        run: QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qml tests/toml.qml
